name: Idea or request
description: Something NxtOS should do, or do better.
labels: ["idea", "beta"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like NxtOS to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What would it let you do that you can't today?
